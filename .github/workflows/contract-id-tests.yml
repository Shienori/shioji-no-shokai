name: Contract ID branch tests
on:
  push:
    branches:
      - fix/contract-id-integrity
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shioji-no-shokai-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund
      - name: Contract identity tests
        if: success()
        run: node tests/contractIdentity.test.mjs
      - name: Contract acceptance tests
        if: '!cancelled() && steps.install.outcome == ''success'''
        run: node tests/contractAcceptanceStore.test.mjs
      - name: Normal offer replenishment tests
        if: '!cancelled() && steps.install.outcome == ''success'''
        run: node tests/normalOfferReplenishment.test.mjs
      - name: Build
        if: '!cancelled() && steps.install.outcome == ''success'''
        run: npm run build
