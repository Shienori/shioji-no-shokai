name: Repair route weather and verify
on:
  push:
    branches: [feature/voyage-planning]
    paths: [.github/workflows/repair-route-weather.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voyage-planning
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shioji-no-shokai-mvp/package-lock.json
      - name: Apply targeted identifier fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('shioji-no-shokai-mvp/src/components/contract/RouteWeatherEditor.tsx')
          s = p.read_text()
          replacements = {
            'hexMap, getPortHexId': 'hexMap',
            'import { getWorldPlanForecastAt }': 'import { getWorldPlanForecastAt, buildVoyagePlanForecastFromWorld }',
            'evaluatePlanWeather, buildPlanTimeline,': 'evaluatePlanWeather, buildPlanTimeline, getPlanPosition,',
            'import { calculateEffectiveSpeedKnots } from "../../domain/shipPerformance";': 'import { GAME_TIME_MULTIPLIER } from "../../data/gameConstants";\nimport { SEA_CONDITION_SLOT_MS } from "../../domain/seaCondition";',
            'import { getHeavyLoadSpeedFactor } from "../../domain/voyage";\n': '',
            'import { calculateContractSchedule } from "../../domain/contractSchedule";\n': '',
            'const terrain = new Map(worldMap.terrain.map(hex => [`${hex.q},${hex.r}`, hex]));\n': '',
            '  const [compactWind, setCompactWind] = useState(true);\n': '',
            '  const shortest = useMemo(() => buildVoyagePlanRoute(endpoints, initialDraft()), [departurePortId, destinationPortId]);\n': '',
            'baseRealTime, offeredDeadlineAt, selectedSpeedKnots': 'baseRealTime, selectedSpeedKnots',
            '      const loadFactor = getHeavyLoadSpeedFactor(contract, selectedShip);\n': '',
            'const weatherResult =': 'const evaluation =',
            'const selectedInfo =': 'const selectedDescription =',
            'const heading=headings.get(cell.id);': '',
            'const angle=onRoute&&selectedHeading!==undefined&&selectedCell?.id===cell.id?selectedHeading:': 'const angle=',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit('Expected source fragment missing: ' + old)
            s = s.replace(old, new)
          s = s.replace('const angle=(', 'const angle=(')
          p.write_text(s)
          p = Path('shioji-no-shokai-mvp/tests/worldPlanForecast.test.mjs')
          s = p.read_text()
          old = "Date.now=originalNow;if(previousStorage)Object.defineProperty(globalThis,'localStorage',previousStorage);else delete globalThis.localStorage;"
          if old not in s:
            raise SystemExit('Expected test cleanup missing')
          p.write_text(s.replace(old, ''))
      - run: npm ci
        working-directory: shioji-no-shokai-mvp
      - run: node tests/worldPlanForecast.test.mjs
        working-directory: shioji-no-shokai-mvp
      - run: npm run build
        working-directory: shioji-no-shokai-mvp
      - name: Commit only verified repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shioji-no-shokai-mvp/src/components/contract/RouteWeatherEditor.tsx shioji-no-shokai-mvp/tests/worldPlanForecast.test.mjs
          git commit -m 'fix: resolve route weather identifiers and test cleanup'
          git push origin HEAD:feature/voyage-planning
